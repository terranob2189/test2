<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スキャナ V9 (自動同期版)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f5f7; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: #fff; padding: 15px; border-radius: 8px; box-sizing: border-box;}
        #video-container { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; overflow: hidden; margin-bottom: 15px; border-radius: 8px;}
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .result-panel { padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; background: #eee; transition: background 0.3s;}
        .result-panel.authentic { background: #d4edda; border: 1px solid #c3e6cb; }
        .result-panel.fake { background: #f8d7da; border: 1px solid #f5c6cb; }
        .result-panel.warning { background: #fff3cd; border: 1px solid #ffeeba; }
        .status-large { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; color: #333;}
        .score { font-size: 2.5em; font-weight: bold; color: #0056b3; line-height: 1; margin: 10px 0; height: 1.2em;}
        .data-desc { font-size: 0.9em; color: #333; margin-bottom: 5px; word-break: break-all; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ccc; display: none;}
        .sync-badge { display: inline-block; background: #007bff; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; margin-bottom: 5px;}
        #warp-canvas { display: none; }
        button { width: 100%; padding: 15px; font-size: 1.2em; background: #0056b3; color: #fff; border: none; border-radius: 4px; cursor: pointer;}
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align:center; margin-top:0;">スキャナ V9 (自動同期)</h2>
    
    <div id="video-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="resultPanel" class="result-panel">
        <div class="status-large" id="statusText">少し離してQRコードを枠に合わせてください</div>
        <div class="score" id="scoreText">---</div>
        <div id="qrData" class="data-desc"></div>
        <canvas id="warp-canvas" width="600" height="600"></canvas>
    </div>

    <button id="startBtn">カメラ起動</button>
</div>

<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {willReadFrequently: true});
    const warpCanvas = document.getElementById("warp-canvas");
    const warpCtx = warpCanvas.getContext("2d", {willReadFrequently: true});
    const CSIZE = 600; 
    let refPatt = new Float32Array(CSIZE * CSIZE);

    function Mulberry32(a) {
        return function() {
            var t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    // QRから読み取ったパラメータを元に正解パターンを動的生成
    function generateRefPattern(nSize, nDensity) {
        const blocks = Math.ceil(CSIZE / nSize);
        const noiseMap = new Int8Array(blocks * blocks);
        const prng = Mulberry32(123456789);
        
        for (let i = 0; i < noiseMap.length; i++) {
            noiseMap[i] = prng() < nDensity ? -1 : 1;
        }

        const rawPatt = new Float32Array(CSIZE * CSIZE);
        for (let y = 0; y < CSIZE; y++) {
            for (let x = 0; x < CSIZE; x++) {
                let nx = Math.floor(x / nSize);
                let ny = Math.floor(y / nSize);
                rawPatt[y * CSIZE + x] = noiseMap[ny * blocks + nx];
            }
        }

        for (let y = 1; y < CSIZE - 1; y++) {
            for (let x = 1; x < CSIZE - 1; x++) {
                let idx = y * CSIZE + x;
                refPatt[idx] = (4 * rawPatt[idx] - rawPatt[idx - CSIZE] - rawPatt[idx + CSIZE] - rawPatt[idx - 1] - rawPatt[idx + 1]); 
            }
        }
    }

    document.getElementById("startBtn").addEventListener("click", () => {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width:{ideal:1920}, height:{ideal:1080} } })
        .then(stream => {
            video.srcObject = stream; video.play();
            requestAnimationFrame(tick);
            document.getElementById("startBtn").style.display = "none";
        });
    });

    let isCalculating = false;
    const resultPanel = document.getElementById("resultPanel");
    const statusText = document.getElementById("statusText");
    const scoreEl = document.getElementById("scoreText");
    const qrDataEl = document.getElementById("qrData");

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA && !isCalculating) {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const guideSize = Math.min(canvas.width, canvas.height) * 0.45;
            const guideX = (canvas.width - guideSize) / 2;
            const guideY = (canvas.height - guideSize) / 2;
            
            ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
            ctx.lineWidth = 4;
            ctx.strokeRect(guideX, guideY, guideSize, guideSize);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

            if (code) {
                const minX = Math.floor(Math.min(code.location.topLeftCorner.x, code.location.bottomLeftCorner.x));
                const maxX = Math.ceil(Math.max(code.location.topRightCorner.x, code.location.bottomRightCorner.x));
                const minY = Math.floor(Math.min(code.location.topLeftCorner.y, code.location.topRightCorner.y));
                const maxY = Math.ceil(Math.max(code.location.bottomLeftCorner.y, code.location.bottomRightCorner.y));
                const qrAverageSize = ((maxX - minX) + (maxY - minY)) / 2;
                
                ctx.beginPath(); ctx.lineWidth = 4; ctx.strokeStyle = "#00FF00";
                ctx.moveTo(code.location.topLeftCorner.x, code.location.topLeftCorner.y);
                ctx.lineTo(code.location.topRightCorner.x, code.location.topRightCorner.y);
                ctx.lineTo(code.location.bottomRightCorner.x, code.location.bottomRightCorner.y);
                ctx.lineTo(code.location.bottomLeftCorner.x, code.location.bottomLeftCorner.y);
                ctx.closePath(); ctx.stroke();

                const sizeRatio = qrAverageSize / guideSize;
                
                if (sizeRatio < 0.65) {
                    resultPanel.className = "result-panel warning";
                    statusText.textContent = "もう少し近づけてください";
                } else if (sizeRatio > 1.35) {
                    resultPanel.className = "result-panel warning";
                    statusText.textContent = "少し離して枠に合わせてください";
                } else {
                    isCalculating = true;
                    
                    // ★V9のコア：メタデータの抽出と自動同期
                    const text = code.data;
                    const match = text.match(/^\[N:([1-3]),(\d{1,3}),(\d{1,3})\](.*)/);
                    let displayData = text;
                    let syncMsg = "";

                    if (match) {
                        const pSize = parseInt(match[1], 10);
                        const pDens = parseInt(match[2], 10) / 100;
                        generateRefPattern(pSize, pDens); // 同期実行
                        displayData = match[4]; // 本来のデータを抽出
                        syncMsg = `<div class="sync-badge">✓ 同期完了 (粒度${pSize} / 密度${match[2]}%)</div><br>`;
                    } else {
                        // V8以前のQRを読んだ場合のフォールバック（デフォルト値で処理）
                        generateRefPattern(2, 0.3);
                        syncMsg = `<div class="sync-badge" style="background:#dc3545;">メタデータなし (初期値で実行)</div><br>`;
                    }

                    resultPanel.className = "result-panel";
                    qrDataEl.style.display = "block";
                    qrDataEl.innerHTML = syncMsg + "読取データ: " + displayData;

                    let dotCount = 0;
                    statusText.textContent = "計算中";
                    scoreEl.style.color = "#666";
                    scoreEl.textContent = "---";
                    
                    const dotInterval = setInterval(() => {
                        dotCount = (dotCount + 1) % 4;
                        statusText.textContent = "計算中" + ".".repeat(dotCount);
                    }, 300);

                    const corners = [code.location.topLeftCorner, code.location.topRightCorner, code.location.bottomRightCorner, code.location.bottomLeftCorner];
                    
                    runAnalysisAsync(imgData, corners).then(score => {
                        clearInterval(dotInterval);
                        const lastScore = Math.max(0, Math.floor(score * 1000));
                        scoreEl.textContent = lastScore;
                        
                        if (lastScore > 150) {
                            resultPanel.className = "result-panel authentic";
                            statusText.textContent = "本物 (Authentic)";
                            scoreEl.style.color = "#155724";
                        } else {
                            resultPanel.className = "result-panel fake";
                            statusText.textContent = "コピー (Copy)";
                            scoreEl.style.color = "#721c24";
                        }

                        setTimeout(() => {
                            isCalculating = false;
                            resultPanel.className = "result-panel";
                            statusText.textContent = "少し離してQRコードを枠に合わせてください";
                            scoreEl.textContent = "---";
                            scoreEl.style.color = "#0056b3";
                            qrDataEl.style.display = "none";
                        }, 3000); 
                    });
                }
            } else {
                resultPanel.className = "result-panel";
                statusText.textContent = "少し離してQRコードを枠に合わせてください";
            }
        }
        requestAnimationFrame(tick);
    }

    async function runAnalysisAsync(imgSrc, corners) {
        const yieldThread = () => new Promise(r => setTimeout(r, 0));
        warpPerspective(warpCtx, imgSrc, corners);
        await yieldThread();
        
        const warpedData = warpCtx.getImageData(0, 0, CSIZE, CSIZE).data;
        const imgHP = new Float32Array(CSIZE * CSIZE);

        for (let y = 1; y < CSIZE - 1; y++) {
            for (let x = 1; x < CSIZE - 1; x++) {
                let idx = (y * CSIZE + x) * 4;
                let l = (warpedData[idx] + warpedData[idx+1] + warpedData[idx+2]) / 3;
                let t = (warpedData[idx-(CSIZE*4)] + warpedData[idx-(CSIZE*4)+1] + warpedData[idx-(CSIZE*4)+2]) / 3;
                let b = (warpedData[idx+(CSIZE*4)] + warpedData[idx+(CSIZE*4)+1] + warpedData[idx+(CSIZE*4)+2]) / 3;
                let lf = (warpedData[idx-4] + warpedData[idx-3] + warpedData[idx-2]) / 3;
                let rt = (warpedData[idx+4] + warpedData[idx+5] + warpedData[idx+6]) / 3;
                imgHP[y * CSIZE + x] = (4 * l - t - b - lf - rt); 
            }
        }
        await yieldThread();

        let totalMaxNCC = 0;
        let validBlocks = 0;
        const BLOCK_SIZE = 40; 
        const SEARCH_RANGE = 4; 

        for (let by = 120; by < 480; by += BLOCK_SIZE) {
            for (let bx = 120; bx < 480; bx += BLOCK_SIZE) {
                let bestBlockNCC = -1;
                
                for (let dy = -SEARCH_RANGE; dy <= SEARCH_RANGE; dy++) {
                    for (let dx = -SEARCH_RANGE; dx <= SEARCH_RANGE; dx++) {
                        let sumI = 0, sumR = 0, sumIR = 0, sumI2 = 0, sumR2 = 0, n = 0;
                        for (let y = 0; y < BLOCK_SIZE; y += 2) {
                            for (let x = 0; x < BLOCK_SIZE; x += 2) {
                                let py = by + y;
                                let px = bx + x;
                                let iVal = imgHP[(py + dy) * CSIZE + (px + dx)];
                                let rVal = refPatt[py * CSIZE + px];
                                
                                sumI += iVal; sumR += rVal; sumIR += iVal * rVal;
                                sumI2 += iVal * iVal; sumR2 += rVal * rVal; n++;
                            }
                        }
                        let meanI = sumI / n, meanR = sumR / n;
                        let num = sumIR - n * meanI * meanR;
                        let den = Math.sqrt((sumI2 - n * meanI * meanI) * (sumR2 - n * meanR * meanR));
                        let ncc = den === 0 ? 0 : num / den;
                        if (ncc > bestBlockNCC) bestBlockNCC = ncc;
                    }
                }
                totalMaxNCC += bestBlockNCC;
                validBlocks++;
            }
            await yieldThread();
        }

        await new Promise(r => setTimeout(r, 400));
        return (totalMaxNCC / validBlocks);
    }

    function warpPerspective(ctxOut, imgSrc, pts) {
        const H = getTransform(pts[0].x, pts[0].y, pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y);
        const outData = ctxOut.createImageData(CSIZE, CSIZE);
        for (let y = 0; y < CSIZE; y++) {
            let v = y / CSIZE;
            for (let x = 0; x < CSIZE; x++) {
                let u = x / CSIZE;
                let den = H[6]*u + H[7]*v + 1;
                let sx = Math.floor((H[0]*u + H[1]*v + H[2]) / den);
                let sy = Math.floor((H[3]*u + H[4]*v + H[5]) / den);
                if (sx >= 0 && sx < imgSrc.width && sy >= 0 && sy < imgSrc.height) {
                    let dIdx = (y * CSIZE + x) * 4;
                    let sIdx = (sy * imgSrc.width + sx) * 4;
                    outData.data[dIdx] = imgSrc.data[sIdx];
                    outData.data[dIdx+1] = imgSrc.data[sIdx+1];
                    outData.data[dIdx+2] = imgSrc.data[sIdx+2];
                    outData.data[dIdx+3] = 255;
                }
            }
        }
        ctxOut.putImageData(outData, 0, 0);
    }
    function getTransform(x0,y0, x1,y1, x2,y2, x3,y3) {
        let dx1 = x1 - x2, dy1 = y1 - y2, dx2 = x3 - x2, dy2 = y3 - y2;
        let sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
        let g = (sx*dy2 - dx2*sy) / (dx1*dy2 - dx2*dy1);
        let h = (dx1*sy - sx*dy1) / (dx1*dy2 - dx2*dy1);
        return [x1 - x0 + g*x1, x3 - x0 + h*x3, x0, y1 - y0 + g*y1, y3 - y0 + h*y3, y0, g, h, 1];
    }
</script>
</body>
</html>
